# cernis-web-harness — phase 1
# DVWA + MariaDB + capture proxy on a single bridge network.
# Only the capture proxy publishes a host port, bound to 127.0.0.1.
# Generators / detector / orchestrator land in later phases.

services:
  db:
    image: mariadb:10.11
    container_name: cernis_db
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-dvwa_root}
      MARIADB_DATABASE: ${DB_NAME:-dvwa}
      MARIADB_USER: ${DB_USER:-dvwa}
      MARIADB_PASSWORD: ${DB_PASSWORD:-p@ssw0rd}
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-dvwa_root}"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [cernis_lab]
    restart: unless-stopped

  dvwa:
    # ghcr.io/digininja/dvwa:latest — pin to a sha after first successful pull (see README).
    image: ghcr.io/digininja/dvwa:latest
    container_name: cernis_dvwa
    environment:
      DB_SERVER: db
      DB_DATABASE: ${DB_NAME:-dvwa}
      DB_USERNAME: ${DB_USER:-dvwa}
      DB_PASSWORD: ${DB_PASSWORD:-p@ssw0rd}
      DEFAULT_SECURITY_LEVEL: ${DVWA_SECURITY_LEVEL:-low}
    depends_on:
      db:
        condition: service_healthy
    networks: [cernis_lab]
    restart: unless-stopped

  capture:
    build: ./capture
    container_name: cernis_capture
    environment:
      UPSTREAM: http://dvwa:80
      DATA_DIR: /data
    volumes:
      - ./data:/data
    ports:
      # 8090 is the human-capture port — host loopback only.
      # 8080 is intentionally NOT published; reachable only on cernis_lab.
      - "127.0.0.1:8090:8090"
    depends_on:
      - dvwa
    networks: [cernis_lab]
    restart: unless-stopped

  playwright_bot:
    build:
      context: ./generators
      dockerfile: playwright_bot/Dockerfile
    container_name: cernis_playwright_bot
    environment:
      CERNIS_TARGET: http://capture:8080
      CERNIS_SESSIONS: ${CERNIS_SESSIONS_BOT:-10}
      DVWA_USER: ${DVWA_USER:-admin}
      DVWA_PASS: ${DVWA_PASS:-password}
    depends_on:
      - capture
    networks: [cernis_lab]
    profiles: ["generators"]

  human_sim:
    build:
      context: ./generators
      dockerfile: human_sim/Dockerfile
    container_name: cernis_human_sim
    environment:
      CERNIS_TARGET: http://capture:8080
      CERNIS_SESSIONS: ${CERNIS_SESSIONS_HUMAN:-10}
      DVWA_USER: ${DVWA_USER:-admin}
      DVWA_PASS: ${DVWA_PASS:-password}
    depends_on:
      - capture
    networks: [cernis_lab]
    profiles: ["generators"]

  pentesterpro:
    build:
      context: ./generators
      dockerfile: pentesterpro/Dockerfile
    container_name: cernis_pentesterpro
    environment:
      CERNIS_TARGET: http://capture:8080
      CERNIS_SESSIONS: ${CERNIS_SESSIONS_PPRO:-10}
      DVWA_USER: ${DVWA_USER:-admin}
      DVWA_PASS: ${DVWA_PASS:-password}
    depends_on:
      - capture
    networks: [cernis_lab]
    profiles: ["generators"]

  detector:
    build: ./detector
    container_name: cernis_detector
    volumes:
      - ./data:/data
    profiles: ["analysis"]

  # ── benign_bot family (negative class) ───────────────────────────────
  # All five services share the same image; CERNIS_BENIGN_BOT picks which
  # family runs. They don't publish ports and only start under the
  # `benign` profile, so existing phase-1..5 smoke tests are unaffected.

  benign_googlebot:
    build:
      context: ./generators
      dockerfile: benign_bots/Dockerfile
    image: cernis-benign-bots:latest
    container_name: cernis_benign_googlebot
    environment:
      CERNIS_TARGET: http://capture:8080
      CERNIS_BENIGN_BOT: googlebot
      CERNIS_SESSIONS: ${CERNIS_SESSIONS_BENIGN:-3}
    depends_on:
      - capture
    networks: [cernis_lab]
    profiles: ["benign"]

  benign_uptime:
    image: cernis-benign-bots:latest
    build:
      context: ./generators
      dockerfile: benign_bots/Dockerfile
    container_name: cernis_benign_uptime
    environment:
      CERNIS_TARGET: http://capture:8080
      CERNIS_BENIGN_BOT: uptime
      CERNIS_SESSIONS: ${CERNIS_SESSIONS_BENIGN:-3}
    depends_on:
      - capture
    networks: [cernis_lab]
    profiles: ["benign"]

  benign_rss:
    image: cernis-benign-bots:latest
    build:
      context: ./generators
      dockerfile: benign_bots/Dockerfile
    container_name: cernis_benign_rss
    environment:
      CERNIS_TARGET: http://capture:8080
      CERNIS_BENIGN_BOT: rss
      CERNIS_SESSIONS: ${CERNIS_SESSIONS_BENIGN:-3}
    depends_on:
      - capture
    networks: [cernis_lab]
    profiles: ["benign"]

  benign_unfurl:
    image: cernis-benign-bots:latest
    build:
      context: ./generators
      dockerfile: benign_bots/Dockerfile
    container_name: cernis_benign_unfurl
    environment:
      CERNIS_TARGET: http://capture:8080
      CERNIS_BENIGN_BOT: unfurl
      CERNIS_SESSIONS: ${CERNIS_SESSIONS_BENIGN:-3}
    depends_on:
      - capture
    networks: [cernis_lab]
    profiles: ["benign"]

  benign_ci:
    image: cernis-benign-bots:latest
    build:
      context: ./generators
      dockerfile: benign_bots/Dockerfile
    container_name: cernis_benign_ci
    environment:
      CERNIS_TARGET: http://capture:8080
      CERNIS_BENIGN_BOT: ci
      CERNIS_SESSIONS: ${CERNIS_SESSIONS_BENIGN:-3}
    depends_on:
      - capture
    networks: [cernis_lab]
    profiles: ["benign"]

  # ── phase 7: additional vulnerable targets + sibling captures ────────
  # Each new target gets its own capture container fronting it; all share
  # the same proxy image but with different UPSTREAM + CERNIS_TARGET_APP.
  # No new published host ports — only the original `capture:8090` is
  # host-visible, and that one still goes to DVWA.

  juiceshop:
    image: bkimminich/juice-shop:latest
    container_name: cernis_juiceshop
    networks: [cernis_lab]
    profiles: ["multitarget"]
    restart: unless-stopped

  capture_juiceshop:
    build: ./capture
    image: cernis-capture:latest
    container_name: cernis_capture_juiceshop
    environment:
      UPSTREAM: http://juiceshop:3000
      CERNIS_TARGET_APP: juice_shop
      DATA_DIR: /data
    volumes:
      - ./data:/data
    depends_on:
      - juiceshop
    networks: [cernis_lab]
    profiles: ["multitarget"]
    restart: unless-stopped

  webgoat:
    image: webgoat/webgoat:latest
    container_name: cernis_webgoat
    networks: [cernis_lab]
    profiles: ["multitarget"]
    restart: unless-stopped

  capture_webgoat:
    build: ./capture
    image: cernis-capture:latest
    container_name: cernis_capture_webgoat
    environment:
      UPSTREAM: http://webgoat:8080
      CERNIS_TARGET_APP: webgoat
      DATA_DIR: /data
    volumes:
      - ./data:/data
    depends_on:
      - webgoat
    networks: [cernis_lab]
    profiles: ["multitarget"]
    restart: unless-stopped

  vampi:
    image: erev0s/vampi:latest
    container_name: cernis_vampi
    networks: [cernis_lab]
    profiles: ["multitarget"]
    restart: unless-stopped

  # phase 12: crAPI lives behind its own compose profile because it's
  # ~7 backing services. See `profiles: ["crapi"]` block below.

  capture_vampi:
    build: ./capture
    image: cernis-capture:latest
    container_name: cernis_capture_vampi
    environment:
      UPSTREAM: http://vampi:5000
      CERNIS_TARGET_APP: vampi
      DATA_DIR: /data
    volumes:
      - ./data:/data
    depends_on:
      - vampi
    networks: [cernis_lab]
    profiles: ["multitarget"]
    restart: unless-stopped

  # ── phase 7: extended attack generators (class=agent, not in phase 5) ─
  # sqlmap is non-browser (exercises the no-beacon path for VAmPI);
  # selenium runs Chromium via chromedriver (different fingerprint than
  # Playwright); puppeteer runs Chromium under a Node runtime.
  # All under profiles:["attack-extended"] so existing 1..6 gates run
  # without them.

  sqlmap_bot:
    build:
      context: ./generators
      dockerfile: sqlmap_bot/Dockerfile
    container_name: cernis_sqlmap_bot
    environment:
      CERNIS_TARGET: ${SQLMAP_TARGET:-http://capture:8080}
      CERNIS_TARGET_APP: ${SQLMAP_TARGET_APP:-dvwa}
      CERNIS_SESSIONS: ${CERNIS_SESSIONS_SQLMAP:-2}
      DVWA_USER: ${DVWA_USER:-admin}
      DVWA_PASS: ${DVWA_PASS:-password}
    depends_on:
      - capture
    networks: [cernis_lab]
    profiles: ["attack-extended"]

  selenium_bot:
    build:
      context: ./generators
      dockerfile: selenium_bot/Dockerfile
    container_name: cernis_selenium_bot
    environment:
      CERNIS_TARGET: ${SELENIUM_TARGET:-http://capture:8080}
      CERNIS_TARGET_APP: ${SELENIUM_TARGET_APP:-dvwa}
      CERNIS_SESSIONS: ${CERNIS_SESSIONS_SELENIUM:-3}
      DVWA_USER: ${DVWA_USER:-admin}
      DVWA_PASS: ${DVWA_PASS:-password}
    depends_on:
      - capture
    networks: [cernis_lab]
    profiles: ["attack-extended"]

  puppeteer_bot:
    build:
      context: ./generators
      dockerfile: puppeteer_bot/Dockerfile
    container_name: cernis_puppeteer_bot
    environment:
      CERNIS_TARGET: ${PUPPETEER_TARGET:-http://capture:8080}
      CERNIS_TARGET_APP: ${PUPPETEER_TARGET_APP:-dvwa}
      CERNIS_SESSIONS: ${CERNIS_SESSIONS_PUPPETEER:-3}
      DVWA_USER: ${DVWA_USER:-admin}
      DVWA_PASS: ${DVWA_PASS:-password}
    depends_on:
      - capture
    networks: [cernis_lab]
    profiles: ["attack-extended"]

  # ── phase 9: stealth twins (family stays the same; stealth=true) ─────
  # Each reuses the matching non-stealth image and toggles CERNIS_STEALTH
  # so the bot picks the slow / honeypot-avoidant code paths. Family in
  # the manifest stays unchanged (playwright_bot / sqlmap / selenium_bot
  # / puppeteer_bot) — only the `stealth` axis differs. Eval slices on
  # (family, stealth) to surface whether stealth degrades recall.

  playwright_bot_stealth:
    build:
      context: ./generators
      dockerfile: playwright_bot/Dockerfile
    container_name: cernis_playwright_bot_stealth
    environment:
      CERNIS_TARGET: ${PLAYWRIGHT_TARGET:-http://capture:8080}
      CERNIS_TARGET_APP: ${PLAYWRIGHT_TARGET_APP:-dvwa}
      CERNIS_SESSIONS: ${CERNIS_SESSIONS_BOT:-5}
      CERNIS_STEALTH: "true"
      DVWA_USER: ${DVWA_USER:-admin}
      DVWA_PASS: ${DVWA_PASS:-password}
    depends_on:
      - capture
    networks: [cernis_lab]
    profiles: ["stealth"]

  sqlmap_stealth:
    build:
      context: ./generators
      dockerfile: sqlmap_bot/Dockerfile
    container_name: cernis_sqlmap_stealth
    environment:
      CERNIS_TARGET: ${SQLMAP_TARGET:-http://capture:8080}
      CERNIS_TARGET_APP: ${SQLMAP_TARGET_APP:-dvwa}
      CERNIS_SESSIONS: ${CERNIS_SESSIONS_SQLMAP:-1}
      CERNIS_STEALTH: "true"
      DVWA_USER: ${DVWA_USER:-admin}
      DVWA_PASS: ${DVWA_PASS:-password}
    depends_on:
      - capture
    networks: [cernis_lab]
    profiles: ["stealth"]

  selenium_bot_stealth:
    build:
      context: ./generators
      dockerfile: selenium_bot/Dockerfile
    container_name: cernis_selenium_bot_stealth
    environment:
      CERNIS_TARGET: ${SELENIUM_TARGET:-http://capture:8080}
      CERNIS_TARGET_APP: ${SELENIUM_TARGET_APP:-dvwa}
      CERNIS_SESSIONS: ${CERNIS_SESSIONS_SELENIUM:-3}
      CERNIS_STEALTH: "true"
      DVWA_USER: ${DVWA_USER:-admin}
      DVWA_PASS: ${DVWA_PASS:-password}
    depends_on:
      - capture
    networks: [cernis_lab]
    profiles: ["stealth"]

  puppeteer_bot_stealth:
    build:
      context: ./generators
      dockerfile: puppeteer_bot/Dockerfile
    container_name: cernis_puppeteer_bot_stealth
    environment:
      CERNIS_TARGET: ${PUPPETEER_TARGET:-http://capture:8080}
      CERNIS_TARGET_APP: ${PUPPETEER_TARGET_APP:-dvwa}
      CERNIS_SESSIONS: ${CERNIS_SESSIONS_PUPPETEER:-3}
      CERNIS_STEALTH: "true"
      DVWA_USER: ${DVWA_USER:-admin}
      DVWA_PASS: ${DVWA_PASS:-password}
    depends_on:
      - capture
    networks: [cernis_lab]
    profiles: ["stealth"]

  # ── phase 11: scanner family — nikto / ffuf / raw httpx / Scrapy ─────
  # All non-browser, all class=agent. Each picks up CERNIS_STEALTH at run
  # time so the same image covers both stealth values. Under
  # profiles:["attack-extended"] so existing 1..10 gates stay unaffected.

  raw_httpx_bot:
    build:
      context: ./generators
      dockerfile: raw_httpx/Dockerfile
    container_name: cernis_raw_httpx_bot
    environment:
      CERNIS_TARGET: ${RAW_HTTPX_TARGET:-http://capture:8080}
      CERNIS_TARGET_APP: ${RAW_HTTPX_TARGET_APP:-dvwa}
      CERNIS_SESSIONS: ${CERNIS_SESSIONS_RAW_HTTPX:-3}
    depends_on:
      - capture
    networks: [cernis_lab]
    profiles: ["attack-extended"]

  ffuf_bot:
    build:
      context: ./generators
      dockerfile: ffuf_bot/Dockerfile
    container_name: cernis_ffuf_bot
    environment:
      CERNIS_TARGET: ${FFUF_TARGET:-http://capture:8080}
      CERNIS_TARGET_APP: ${FFUF_TARGET_APP:-dvwa}
      CERNIS_SESSIONS: ${CERNIS_SESSIONS_FFUF:-2}
    depends_on:
      - capture
    networks: [cernis_lab]
    profiles: ["attack-extended"]

  scrapy_bot:
    build:
      context: ./generators
      dockerfile: scrapy_bot/Dockerfile
    container_name: cernis_scrapy_bot
    environment:
      CERNIS_TARGET: ${SCRAPY_TARGET:-http://capture:8080}
      CERNIS_TARGET_APP: ${SCRAPY_TARGET_APP:-dvwa}
      CERNIS_SESSIONS: ${CERNIS_SESSIONS_SCRAPY:-2}
    depends_on:
      - capture
    networks: [cernis_lab]
    profiles: ["attack-extended"]

  nikto_bot:
    build:
      context: ./generators
      dockerfile: nikto_bot/Dockerfile
    container_name: cernis_nikto_bot
    environment:
      CERNIS_TARGET: ${NIKTO_TARGET:-http://capture:8080}
      CERNIS_TARGET_APP: ${NIKTO_TARGET_APP:-dvwa}
      CERNIS_SESSIONS: ${CERNIS_SESSIONS_NIKTO:-1}
    depends_on:
      - capture
    networks: [cernis_lab]
    profiles: ["attack-extended"]

  # ── phase 12: crAPI fourth target (OWASP API security demo) ──────────
  # crAPI is a 4-microservice OWASP API security playground (web /
  # identity / community / workshop) backed by mongo + postgres + a
  # rabbitmq + mailhog. The capture proxy fronts `crapi-web` (the user-
  # facing gateway on :8888) which reverse-proxies internally to the
  # microservices, so a single capture container sees the whole API
  # surface. All under `profiles: ["crapi"]` so the (heavy) backing
  # services don't auto-start. None of crAPI's services publish ports —
  # capture_crapi inherits the loopback-only invariant.
  #
  # crAPI is heavier than VAmPI (~7 backing services vs 1) so this is
  # a separate profile rather than rolling into "multitarget". Bring
  # it up with:  docker compose --profile crapi up -d --build

  crapi_mongodb:
    image: mongo:6
    container_name: cernis_crapi_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: crapi
      MONGO_INITDB_ROOT_PASSWORD: crapi
    networks: [cernis_lab]
    profiles: ["crapi"]
    restart: unless-stopped

  crapi_postgresdb:
    image: postgres:14
    container_name: cernis_crapi_postgresdb
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: crapisecretpassword
    networks: [cernis_lab]
    profiles: ["crapi"]
    restart: unless-stopped

  crapi_mailhog:
    image: mailhog/mailhog:latest
    container_name: cernis_crapi_mailhog
    networks: [cernis_lab]
    profiles: ["crapi"]
    restart: unless-stopped

  crapi_rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: cernis_crapi_rabbitmq
    networks: [cernis_lab]
    profiles: ["crapi"]
    restart: unless-stopped

  crapi_identity:
    image: crapi/crapi-identity:latest
    container_name: cernis_crapi_identity
    environment:
      DB_NAME: crapi
      DB_USER: admin
      DB_PASSWORD: crapisecretpassword
      DB_HOST: crapi_postgresdb
      DB_PORT: 5432
      SMTP_HOST: crapi_mailhog
      SMTP_PORT: 1025
    depends_on:
      - crapi_postgresdb
      - crapi_mailhog
    networks: [cernis_lab]
    profiles: ["crapi"]
    restart: unless-stopped

  crapi_community:
    image: crapi/crapi-community:latest
    container_name: cernis_crapi_community
    environment:
      MONGO_DB_HOST: crapi_mongodb
      MONGO_DB_PORT: 27017
      MONGO_DB_USER: crapi
      MONGO_DB_PASSWORD: crapi
      MONGO_DB_NAME: crapi
      IDENTITY_SERVICE_HOST: crapi_identity
      IDENTITY_SERVICE_PORT: 8080
    depends_on:
      - crapi_mongodb
      - crapi_identity
    networks: [cernis_lab]
    profiles: ["crapi"]
    restart: unless-stopped

  crapi_workshop:
    image: crapi/crapi-workshop:latest
    container_name: cernis_crapi_workshop
    environment:
      DB_NAME: crapi
      DB_USER: admin
      DB_PASSWORD: crapisecretpassword
      DB_HOST: crapi_postgresdb
      DB_PORT: 5432
      MONGO_DB_HOST: crapi_mongodb
      MONGO_DB_PORT: 27017
      MONGO_DB_USER: crapi
      MONGO_DB_PASSWORD: crapi
      MONGO_DB_NAME: crapi
      IDENTITY_SERVICE_HOST: crapi_identity
      IDENTITY_SERVICE_PORT: 8080
      RABBITMQ_HOST: crapi_rabbitmq
    depends_on:
      - crapi_mongodb
      - crapi_postgresdb
      - crapi_identity
      - crapi_rabbitmq
    networks: [cernis_lab]
    profiles: ["crapi"]
    restart: unless-stopped

  crapi:
    # The user-facing gateway. Reverse-proxies internally to identity /
    # community / workshop so capture_crapi sees the full API surface
    # from one upstream.
    image: crapi/crapi-web:latest
    container_name: cernis_crapi
    environment:
      IDENTITY_SERVICE_HOST: crapi_identity
      IDENTITY_SERVICE_PORT: 8080
      COMMUNITY_SERVICE_HOST: crapi_community
      COMMUNITY_SERVICE_PORT: 8087
      WORKSHOP_SERVICE_HOST: crapi_workshop
      WORKSHOP_SERVICE_PORT: 8000
    depends_on:
      - crapi_identity
      - crapi_community
      - crapi_workshop
    networks: [cernis_lab]
    profiles: ["crapi"]
    restart: unless-stopped

  capture_crapi:
    build: ./capture
    image: cernis-capture:latest
    container_name: cernis_capture_crapi
    environment:
      UPSTREAM: http://crapi:8888
      CERNIS_TARGET_APP: crapi
      DATA_DIR: /data
    volumes:
      - ./data:/data
    depends_on:
      - crapi
    networks: [cernis_lab]
    profiles: ["crapi"]
    restart: unless-stopped

networks:
  cernis_lab:
    name: cernis_lab
    driver: bridge
